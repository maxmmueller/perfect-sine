<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Perfect Sine - Pure Math Wave Challenge</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="logo-area">
          <span class="app-title">Perfect Sine</span>
        </div>
        <div class="hud-metrics">
          <div class="hud-pill" id="hud-score-pill">
            <span class="hud-label">SCORE</span>
            <span class="hud-val" id="hud-current-score">-</span>
          </div>
          <div class="hud-pill" id="hud-best-pill">
            <span class="hud-label">BEST</span>
            <span class="hud-val" id="hud-highscore">0 pts</span>
          </div>
          <button id="wrapped-btn" class="share-btn" aria-label="Share wave summary" title="Share Wave Summary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
              <polyline points="16 6 12 2 8 6"></polyline>
              <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
          </button>
        </div>
      </header>

      <main class="canvas-container">
        <canvas id="sine-canvas"></canvas>
      </main>

      <!-- Spotify-Wrapped-Style Summary Modal -->
      <div id="wrapped-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-backdrop"></div>
        <div class="modal-card">
          <button id="modal-close-x" class="modal-close-btn" aria-label="Close Summary">✕</button>
          
          <div class="modal-header">
            <span class="wrapped-tag">SESSION SUMMARY</span>
            <h2 id="modal-title">Wave Summary</h2>
            <p id="modal-persona-title" class="persona-title">Laser Harmonic Synthesizer</p>
            <p id="modal-persona-subtitle" class="persona-subtitle">Sublime neuromuscular calibration and pristine sinusoidal precision.</p>
          </div>

          <div class="stats-grid">
            <div class="stat-card highlight">
              <span class="stat-label">Personal Best</span>
              <span id="stat-highscore" class="stat-val">0 pts</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Avg Accuracy</span>
              <span id="stat-avg-accuracy" class="stat-val">0%</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Total Attempts</span>
              <span id="stat-attempts" class="stat-val">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Total Cycles</span>
              <span id="stat-cycles" class="stat-val">0.0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Consistency</span>
              <span id="stat-consistency" class="stat-val">100 / 100</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Best Streak (≥80%)</span>
              <span id="stat-streak" class="stat-val">0</span>
            </div>
          </div>

          <div class="modal-actions">
            <button id="modal-resume-btn" class="btn-primary">Keep Drawing</button>
            <button id="modal-reset-btn" class="btn-secondary">Reset Stats</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
